<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>墨典联盟 · 平阳演示预览</title>
  <style>
    :root { --phone-w: 390px; --phone-h: 844px; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
      background: #161310;
      color: #F4EDE3;
    }
    .stage {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 36px;
      max-width: 1080px;
      margin: 0 auto;
      padding: 36px 24px 56px;
    }
    .panel h1 { font-size: 28px; letter-spacing: .08em; font-weight: 600; }
    .panel p { margin-top: 10px; color: #C9BBA8; font-size: 14px; line-height: 1.7; }
    .label { margin: 26px 0 10px; font-size: 12px; letter-spacing: .16em; color: #E0C089; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip, .role-chip {
      border: 1px solid rgba(244,237,227,.22);
      background: transparent;
      color: #EDE4D6;
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 13px;
    }
    .chip.on, .role-chip.on { background: #C45C3A; border-color: #C45C3A; color: #fff; }
    .hint { margin-top: 22px; font-size: 12px; color: #B0A494; line-height: 1.65; }
    .blurb {
      margin-top: 18px; padding: 12px 14px; border-radius: 12px;
      background: rgba(255,255,255,.05); color: #EDE4D6; font-size: 13px; line-height: 1.65;
    }

    .phone-wrap { display: flex; justify-content: center; }
    .phone {
      width: var(--phone-w);
      height: var(--phone-h);
      border-radius: 40px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      box-shadow: 0 40px 80px rgba(0,0,0,.45);
      border: 10px solid #2A2622;
      font-size: 15px;
      line-height: 1.4;
    }
    .chrome {
      background: var(--chrome);
      color: var(--chrome-text);
      padding: 10px 10px 10px 16px;
      flex-shrink: 0;
      position: relative;
      z-index: 2;
    }
    .status {
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 650;
    }
    .status-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .capsule {
      width: 86px; height: 30px; border-radius: 15px;
      background: #111; opacity: .88; flex-shrink: 0;
    }
    .id-switch {
      display: flex; padding: 2px; border-radius: 10px; flex-shrink: 0;
      background: var(--switch-bg);
    }
    .id-switch button {
      border: 0; background: transparent; min-width: 46px; height: 26px;
      font-size: 12px; font-weight: 650; cursor: pointer; border-radius: 8px;
      color: var(--switch-text);
    }
    .id-switch .on { background: var(--switch-on); color: var(--switch-on-text); }
    .nav { padding: 6px 6px 2px 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .nav-title { font-size: 18px; font-weight: 700; color: var(--chrome-text); letter-spacing: .02em; display: flex; align-items: center; gap: 4px; }
    .nav-title .caret svg { width: 14px; height: 14px; stroke: currentColor; fill: none; }
    .nav-loc { font-size: 12px; margin-top: 2px; color: var(--chrome-muted); }
    .nav-tools { display: flex; gap: 10px; color: var(--chrome-text); flex-shrink: 0; }
    .nav-tools button { background: none; border: 0; padding: 0; color: inherit; cursor: pointer; display: flex; }
    .nav-tools svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    .screen {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 12px 14px 22px;
      background: var(--bg);
      color: var(--text);
      position: relative;
    }
    .screen::-webkit-scrollbar { width: 0; }
    svg { overflow: visible; }

    .tabbar {
      flex-shrink: 0;
      height: 72px; display: flex; padding: 6px 4px 14px;
      background: var(--bar);
      border-top: 1px solid var(--line);
      color: var(--tab);
    }
    .tab {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 3px; font-size: 11px; font-weight: 600;
      cursor: pointer; background: none; border: 0; color: inherit;
    }
    .tab svg, .stamp svg, .ico svg, .mark svg, .mi-ico svg, .time-ico svg, .orders svg, .stat-ico svg {
      width: 22px; height: 22px; stroke: currentColor; fill: none;
      stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
    }
    .tab.on { color: var(--tab-on); }
    .stamp {
      width: 30px; height: 30px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center; color: #fff;
    }
    .stamp svg { width: 16px; height: 16px; stroke: #fff; }

    .hero { height: 168px; border-radius: var(--radius); overflow: hidden; position: relative; margin-bottom: 14px; }
    .hero img, .thumb img, .vcard img, .step-pic img, .banner img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .hero-cap {
      position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 14px 12px;
      background: linear-gradient(transparent, rgba(0,0,0,.78));
      color: #fff;
    }
    .hero-cap b { display: block; font-size: 18px; font-weight: 700; }
    .hero-cap span { font-size: 12px; color: #F3EDE4; }

    .cats {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px 6px;
      margin: 4px 0 16px; text-align: center; font-size: 11px; font-weight: 600; color: var(--text);
    }
    .cats.cols4 { grid-template-columns: repeat(4, 1fr); }
    .cats .ico {
      width: 46px; height: 46px; margin: 0 auto 6px; display: flex;
      align-items: center; justify-content: center; color: #fff;
    }

    .row { display: flex; gap: 12px; padding: 12px 0; cursor: pointer; align-items: flex-start; }
    .thumb { width: 86px; height: 86px; flex-shrink: 0; overflow: hidden; background: var(--surface); }
    .meta { flex: 1; min-width: 0; }
    .meta b { display: block; font-size: 15px; font-weight: 700; color: var(--text); }
    .sub { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.45; }
    .tag {
      display: inline-block; font-size: 10px; font-weight: 700; padding: 1px 6px;
      border-radius: 4px; margin-left: 6px; vertical-align: middle;
      background: var(--accent); color: var(--on-accent);
    }
    .ops { display: flex; gap: 8px; margin-top: 8px; }
    .btn {
      border: 0; cursor: pointer; height: 30px; padding: 0 12px;
      font-size: 12px; font-weight: 700; display: inline-flex; align-items: center;
      justify-content: center; border-radius: var(--btn-radius);
    }
    .btn.fill { background: var(--accent); color: var(--on-accent); }
    .btn.ghost { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
    .sec {
      display: flex; justify-content: space-between; align-items: baseline;
      margin: 16px 0 8px; font-size: 16px; font-weight: 700; color: var(--text);
    }
    .sec span { font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; }

    .stats { display: flex; gap: 8px; margin-bottom: 12px; }
    .stat { flex: 1; padding: 12px 6px; text-align: center; background: var(--surface); border-radius: var(--radius); }
    .stat b { display: block; font-size: 18px; color: var(--text); }
    .stat span { font-size: 11px; color: var(--muted); }
    .stat-ico { color: var(--accent); margin: 0 auto 4px; display: flex; justify-content: center; }
    .stat-ico svg { width: 20px; height: 20px; }

    .wallet { padding: 16px; margin-bottom: 12px; background: var(--surface); border-radius: var(--radius); }
    .wallet .n { font-size: 36px; font-weight: 750; letter-spacing: -1px; color: var(--text); }
    .menu-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 13px 4px; font-size: 14px; font-weight: 600; cursor: pointer;
      color: var(--text); border-bottom: 1px solid var(--line);
    }
    .menu-item .sub { margin: 0; font-weight: 500; }
    .mi { display: flex; align-items: center; gap: 10px; }
    .mi-ico {
      width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
      color: var(--accent); flex-shrink: 0;
    }
    .mi-ico svg { width: 18px; height: 18px; }
    .chev { color: var(--muted); display: flex; }
    .chev svg { width: 16px; height: 16px; }
    .profile { display: flex; gap: 12px; align-items: center; margin: 4px 0 16px; }
    .profile > svg { width: 16px; height: 16px; flex-shrink: 0; }
    .avatar {
      width: 54px; height: 54px; display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 700; background: var(--accent); color: var(--on-accent);
      border-radius: var(--btn-radius); flex-shrink: 0; overflow: hidden;
    }
    .avatar svg { width: 22px; height: 22px; }
    .avatar-photo {
      width: 54px; height: 54px; border-radius: 50%; object-fit: cover; flex-shrink: 0;
    }
    .people { display: flex; gap: 10px; overflow: auto; margin: 8px 0 14px; }
    .people::-webkit-scrollbar { height: 0; }
    .p-card { flex: 0 0 92px; text-align: center; cursor: pointer; }
    .p-card img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; display: block; margin: 0 auto 6px; }
    .p-card b { display: block; font-size: 12px; color: var(--text); }
    .p-card .sub { margin-top: 2px; font-size: 10px; }
    .review { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
    .review img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .review b { font-size: 13px; }
    .review .sub { margin-top: 3px; }
    .quick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .quick div {
      height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px;
      font-size: 13px; font-weight: 700; cursor: pointer;
      background: var(--surface); color: var(--text); border-radius: var(--radius);
    }
    .quick svg { width: 18px; height: 18px; stroke: var(--accent); fill: none; stroke-width: 1.8; }
    .search {
      height: 40px; display: flex; align-items: center; padding: 0 12px;
      font-size: 13px; margin-bottom: 12px; cursor: pointer; gap: 8px;
      background: var(--surface); color: var(--muted); border-radius: var(--radius);
    }
    .search svg { width: 16px; height: 16px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .search-go { margin-left: auto; height: 28px; }
    .filters { display: flex; gap: 6px; overflow: auto; margin-bottom: 10px; }
    .filters::-webkit-scrollbar { height: 0; }
    .filters button {
      height: 30px; padding: 0 12px; border: 0; font-size: 12px; font-weight: 650;
      cursor: pointer; white-space: nowrap; background: var(--surface); color: var(--muted);
      border-radius: var(--btn-radius);
    }
    .filters button.on { background: var(--accent); color: var(--on-accent); }
    .route { padding: 14px; margin-bottom: 12px; background: var(--surface); border-radius: var(--radius); position: relative; }
    .step { display: flex; gap: 10px; padding: 10px 0; align-items: center; position: relative; }
    .time-ico {
      width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: #FFE0CC; color: #E85A28;
    }
    .time-ico svg { width: 16px; height: 16px; }
    .step-pic { width: 56px; height: 56px; border-radius: 14px; overflow: hidden; flex-shrink: 0; }
    .vrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
    .vrow4 { grid-template-columns: repeat(4, 1fr); }
    .vcard { cursor: pointer; }
    .vcard .pic { height: 88px; overflow: hidden; border-radius: var(--radius); }
    .vcard .pic.tall { height: 108px; }
    .vcard b { display: block; font-size: 12px; margin-top: 6px; color: var(--text); }
    .vcard .btn { width: 100%; margin-top: 8px; height: 28px; }
    .grid8 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 6px; text-align: center; margin: 8px 0 16px; }
    .grid8 .cell { cursor: pointer; }
    .grid8 .mark {
      width: 42px; height: 42px; margin: 0 auto 6px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      background: var(--surface); color: var(--accent);
    }
    .grid8 span { font-size: 11px; color: var(--text); font-weight: 600; }
    .orders { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 8px 0 16px; text-align: center; }
    .orders div { cursor: pointer; color: var(--accent); }
    .orders b { display: block; font-size: 12px; color: var(--text); margin-top: 4px; font-weight: 650; }
    .goldcard {
      padding: 18px 16px; border-radius: var(--radius); margin-bottom: 14px;
      background: linear-gradient(135deg, #3A2A18, #1A140E);
      color: #F7E7C6; position: relative; overflow: hidden;
    }
    .goldcard .crown {
      position: absolute; right: 10px; top: 6px; opacity: .18; color: #E8C98A;
    }
    .goldcard .crown svg { width: 72px; height: 72px; stroke-width: 1.2; }
    .goldcard .sub { color: #E0C89A; }
    .goldcard .n { color: #F7E7C6; }
    .stack-card {
      padding: 16px; border-radius: 14px; margin-bottom: 10px; color: #fff; cursor: pointer;
      position: relative;
    }
    .stack-card .sub { color: rgba(255,255,255,.9); }
    .stack-card.light { color: #3A2416; }
    .stack-card.light .sub { color: #6B4A32; }
    .dash-add {
      border: 1.5px dashed var(--accent); background: transparent; color: var(--accent);
      height: 44px; width: 100%; border-radius: 12px; font-weight: 700; cursor: pointer;
    }
    .mini-map {
      height: 128px; border-radius: var(--radius); overflow: hidden; margin-bottom: 12px;
      position: relative;
    }
    .mini-map svg { width: 100%; height: 100%; display: block; }
    .banner { height: 110px; border-radius: var(--radius); overflow: hidden; position: relative; margin-top: 8px; }
    .banner .hero-cap { padding: 10px 12px; }
    .toast {
      position: absolute; left: 50%; bottom: 88px; transform: translateX(-50%);
      background: rgba(20,16,12,.92); color: #fff; padding: 9px 16px; border-radius: 8px;
      font-size: 12px; opacity: 0; pointer-events: none; transition: .2s; white-space: nowrap;
      z-index: 5;
    }
    .toast.show { opacity: 1; }
    .loc-pill {
      display: inline-flex; align-items: center; gap: 4px;
      background: var(--accent); color: var(--on-accent);
      height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 700;
      margin-bottom: 12px;
    }
    .loc-pill svg { width: 12px; height: 12px; stroke: currentColor; fill: none; }

    /* A 江南 · 对齐风格图 */
    .phone[data-theme="jiangnan"] {
      --bg: #F6F2E9; --surface: #FFFbf6; --text: #1A1916; --muted: #6B6358;
      --accent: #1B4332; --on-accent: #fff; --chrome: #F6F2E9; --chrome-text: #1A1916;
      --chrome-muted: #6B6358; --bar: #FAF7F0; --tab: #8A8378; --tab-on: #1B4332;
      --line: #E6DCCB; --radius: 12px; --btn-radius: 8px;
      --gold: #B89A6F; --switch-bg: #EBE3D4; --switch-text: #6B6358; --switch-on: #1B4332; --switch-on-text: #fff;
    }
    .phone[data-theme="jiangnan"] .nav-title { font-family: "Songti SC", "STSong", "Noto Serif SC", serif; font-size: 19px; letter-spacing: .08em; font-weight: 700; }
    .phone[data-theme="jiangnan"] .screen {
      background-color: #F6F2E9;
      background-image:
        radial-gradient(ellipse at 50% 118%, rgba(27,67,50,.06), transparent 46%),
        repeating-linear-gradient(-18deg, transparent, transparent 22px, rgba(160,140,110,.03) 23px);
    }
    .phone[data-theme="jiangnan"] .screen.edge { padding: 0 0 18px; }
    .phone[data-theme="jiangnan"] .cats { font-size: 10px; gap: 10px 2px; margin: 2px 0 14px; }
    .phone[data-theme="jiangnan"] .cats .ico { border-radius: 50%; width: 48px; height: 48px; }
    .phone[data-theme="jiangnan"] .thumb { border-radius: 10px; }
    .phone[data-theme="jiangnan"] .hero { border-radius: 12px; height: 158px; }
    .phone[data-theme="jiangnan"] .grid8 .mark { background: transparent; color: #1B4332; }
    .phone[data-theme="jiangnan"] .tag { background: #1B4332; color: #fff; font-weight: 650; }
    .phone[data-theme="jiangnan"] .tag.gold { background: #C4A574; color: #1A140C; }
    .phone[data-theme="jiangnan"] .search {
      background: #fff; border-radius: 999px; height: 40px; padding: 3px 3px 3px 14px;
      box-shadow: 0 1px 0 rgba(27,67,50,.04);
    }
    .phone[data-theme="jiangnan"] .search-go { background: #1B4332; color: #fff; border-radius: 999px; height: 32px; padding: 0 14px; }
    .phone[data-theme="jiangnan"] .filters { gap: 0; border-bottom: 1px solid #E6DCCB; margin: 0 -14px 8px; padding: 0 8px; }
    .phone[data-theme="jiangnan"] .filters button {
      background: transparent; color: #6B6358; border-radius: 0; height: 36px;
      padding: 0 12px; font-weight: 650; box-shadow: none;
    }
    .phone[data-theme="jiangnan"] .filters button.on {
      background: transparent; color: #1B4332; border-bottom: 2.5px solid #1B4332;
    }
    .phone[data-theme="jiangnan"] .mini-map { height: 176px; border-radius: 0; margin: 0 -14px 0; position: relative; }
    .phone[data-theme="jiangnan"] .map-fab {
      position: absolute; right: 12px; bottom: 12px; width: 36px; height: 36px;
      border-radius: 50%; background: #fff; border: 0; color: #1B4332;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      box-shadow: 0 4px 12px rgba(27,67,50,.18);
    }
    .phone[data-theme="jiangnan"] .map-fab svg { width: 18px; height: 18px; }
    .phone[data-theme="jiangnan"] .jn-promo {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      background: #EDE3D0; border-radius: 12px; padding: 14px 14px; margin: 4px 0 8px;
    }
    .phone[data-theme="jiangnan"] .jn-promo b { color: #1B4332; }
    .phone[data-theme="jiangnan"] .btn-round-gold {
      width: 64px; height: 64px; border-radius: 50%; border: 0; cursor: pointer;
      background: #B89A6F; color: #1A140C; font-size: 11px; font-weight: 800; line-height: 1.25;
      flex-shrink: 0;
    }
    .phone[data-theme="jiangnan"] .vcard .pic { height: 92px; }
    .phone[data-theme="jiangnan"] .vcard .desc { font-size: 11px; color: #6B6358; margin-top: 2px; }
    .phone[data-theme="jiangnan"] .offer { color: #1B4332; font-size: 12px; font-weight: 700; margin-top: 4px; }
    .phone[data-theme="jiangnan"] .goldcard {
      background: linear-gradient(135deg, #2C241C, #1A1612 55%, #3A2E22);
      color: #F4E6C8; border-radius: 14px;
    }
    .phone[data-theme="jiangnan"] .goldcard .btn.fill { background: #B89A6F; color: #1A140C; }
    .phone[data-theme="jiangnan"] .jn-ticket {
      display: flex; align-items: stretch; background: linear-gradient(90deg, #F3E6C8, #F7F0DC);
      border-radius: 12px; overflow: hidden; margin-bottom: 14px; min-height: 92px;
    }
    .phone[data-theme="jiangnan"] .jn-ticket-val {
      width: 88px; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #1B4332;
    }
    .phone[data-theme="jiangnan"] .jn-ticket-val b { font-size: 26px; font-weight: 800; }
    .phone[data-theme="jiangnan"] .jn-ticket-val span { font-size: 11px; color: #6B6358; }
    .phone[data-theme="jiangnan"] .jn-ticket-dash {
      width: 0; border-left: 1.5px dashed #C4B089; margin: 10px 0;
    }
    .phone[data-theme="jiangnan"] .jn-ticket-body {
      flex: 1; padding: 12px 12px 12px 14px; display: flex; flex-direction: column; justify-content: center;
    }
    .phone[data-theme="jiangnan"] .jn-ticket-body .btn { align-self: flex-start; margin-top: 8px; background: #1B4332; color: #fff; }
    .phone[data-theme="jiangnan"] .jn-mine-hero {
      position: relative; height: 168px; margin-bottom: 12px; overflow: hidden;
    }
    .phone[data-theme="jiangnan"] .jn-mine-hero img.bg { width: 100%; height: 100%; object-fit: cover; display: block; filter: saturate(.85); }
    .phone[data-theme="jiangnan"] .jn-mine-hero::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(246,242,233,.15), rgba(246,242,233,.92) 78%, #F6F2E9);
    }
    .phone[data-theme="jiangnan"] .jn-mine-user {
      position: absolute; left: 16px; right: 16px; bottom: 10px; z-index: 1;
      display: flex; gap: 12px; align-items: center;
    }
    .phone[data-theme="jiangnan"] .avatar-photo {
      width: 56px; height: 56px; border-radius: 50%; object-fit: cover; border: 2px solid #fff;
    }
    .phone[data-theme="jiangnan"] .badge {
      display: inline-block; font-size: 10px; font-weight: 700; padding: 1px 7px;
      border-radius: 999px; background: #1B4332; color: #fff; margin-left: 6px; vertical-align: middle;
    }
    .phone[data-theme="jiangnan"] .orders { color: #1B4332; }
    .phone[data-theme="jiangnan"] .sec { font-family: "Songti SC", "STSong", serif; letter-spacing: .06em; }

    /* B 微信本地 */
    .phone[data-theme="wechat"] {
      --bg: #EDEDED; --surface: #fff; --text: #111111; --muted: #666666;
      --accent: #07C160; --on-accent: #fff; --chrome: #07C160; --chrome-text: #fff;

      if (state.theme === "family") {
        const cards = [
          ["#F68D5D","ticket","周末门票","南雁亲子谷 2 张"],
          ["#A8D18D","box","亲子套餐","三店通用"],
          ["#F6D56A","star","星星积分","1280 颗"],
          ["#8FB7E7","gift","生日礼","待领取"],
        ];
        return `
          ${cards.map(c => `<div class="fam-pass" style="background:${c[0]}" onclick="demo(event)"><div class="mark">${ico(c[1])}</div><div><b>${c[2]}</b><div class="sub">${c[3]}</div></div></div>`).join("")}
        `;
      }
      return `
        <div class="goldcard">
          <div class="crown">${ico("crown")}</div>
          <div class="sub">墨典联盟会员</div>
          <div class="n" style="font-size:28px;margin:4px 0 2px">成长值 2680</div>
          <div class="sub">平阳专属生活权益</div>
          <div class="ops"><button class="btn fill" onclick="demo(event)">立即查看</button></div>
        </div>
        <div class="sec">会员权益</div>
        <div class="grid8" style="grid-template-columns:repeat(4,1fr)">
          ${[["专属优惠","spark"],["积分兑换","coin"],["生日礼遇","cake"],["会员日活动","cal"]].map(x => `<div class="cell" onclick="demo(event)"><div class="mark">${ico(x[1])}</div><span>${x[0]}</span></div>`).join("")}
        </div>
        <div class="sec">会员专享券</div>
        <div class="jn-ticket" onclick="demo(event)">
          <div class="jn-ticket-val"><b>¥30</b><span>满减券</span></div>
          <div class="jn-ticket-dash"></div>
          <div class="jn-ticket-body">
            <b>昆阳美食三店通</b>
            <div class="sub">有效期至 2026.12.31</div>
            <button class="btn fill" onclick="demo(event)">立即使用</button>
          </div>
        </div>
        <div class="sec">推荐商家 <span onclick="demo(event)">更多 &gt;</span></div>
        <div class="vrow vrow4">
          ${shops.slice(0,4).map(s => `<div class="vcard" onclick="demo(event)"><div class="pic"><img src="${img(s.cover)}"></div><b>${s.name}</b><div class="desc">${s.offer}</div></div>`).join("")}
        </div>
      `;
    }

    function memberMerchant() {
      return `
        <div class="stats">
          <div class="stat"><b>3</b><span>待核销</span></div>
          <div class="stat"><b>26</b><span>本周已核</span></div>
          <div class="stat"><b>¥860</b><span>待兑积分</span></div>
        </div>
        ${queue.map(q => `<div class="row" onclick="demo(event)"><div class="thumb"><img src="${img(q.cover)}"></div><div class="meta"><b>${q.title}</b><div class="sub">${q.user} · ${q.remain}</div><div class="ops"><button class="btn fill" onclick="demo(event)">核销</button></div></div></div>`).join("")}
      `;
    }

    function mine() {
      const merchant = state.role === "merchant";
      const name = merchant ? "昆阳茶寮" : (state.theme === "family" ? "平阳小朋友" : state.theme === "biz" ? "星级会员 V3" : "平阳会员");
      const sub = merchant ? "执照审核通过 · 二级商户" : "首次消费已锁客 · 昆阳茶寮";
      const orders = merchant
        ? [["待核","scan"],["已核","check"],["提现","cash"],["售后","refund"]]
        : [["待付","pay"],["待用","ticket"],["待评","chat"],["退款","refund"]];
      const grid = merchant
        ? [["入驻","hotel"],["上架","box"],["分账","coin"],["提现","cash"],["店照","cam"],["核销","scan"],["帮助","help"],["设置","gear"]]
        : [["收藏","heart"],["足迹","foot"],["积分","coin"],["卡券","ticket"],["入驻","hotel"],["分享","share"],["帮助","help"],["设置","gear"]];
      const list = merchant
        ? [["hotel","入驻资料","已提交"],["box","上架券 / 套餐","查看"],["coin","分账与提现","收付通"],["spark","跨店贡献","¥420"]]
        : [["star","我的收藏",""],["chat","我的评价",""],["pin","常用地址",""],["help","客服",""],["gear","设置",""]];

      const profile = `<div class="profile">
        <div class="avatar">${merchant ? "店" : "墨"}</div>
        <div><b>${name}</b><div class="sub">${sub}</div></div>
      </div>`;

      if (state.theme === "wechat" && !merchant) {
        return `
          <div class="wc-mine">
            <div class="profile" onclick="demo(event)">
              <img class="avatar-photo" src="${img("u-wx")}" alt="">
              <div style="flex:1;min-width:0">
                <b>墨典小伙伴 LV3</b>
                <div class="sub">平阳生活 · 墨典同行</div>
              </div>
              <span class="chev">${ico("chev")}</span>
            </div>
            <div class="stats">
              <div class="stat"><b>5</b><span>收藏</span></div>
              <div class="stat"><b>12</b><span>关注</span></div>
              <div class="stat"><b>8</b><span>足迹</span></div>
              <div class="stat"><b>28</b><span>卡券</span></div>
            </div>
          </div>
          <div class="wc-block">
            <div class="sec" style="padding:0;margin:0 0 8px">我的订单 <span onclick="demo(event)">全部订单 &gt;</span></div>
            <div class="orders">
              ${[["待付款","pay"],["待使用","ticket"],["待评价","chat"],["退款/售后","refund"]].map(o => `<div onclick="demo(event)">${ico(o[1])}<b>${o[0]}</b></div>`).join("")}
            </div>
          </div>
          ${[["star","我的收藏"],["chat","我的评价"],["pin","常用地址"],["headset","客服与帮助"],["gear","设置"]].map(m => menuRow(m[0], m[1], "")).join("")}
          <div class="wc-block">${peopleStrip("wechat", "关注的人")}</div>
        `;
      }
      if (state.theme === "biz" && !merchant) {
        return `
          <div class="profile">
            <img class="avatar-photo" src="${img("u-biz")}" alt="" style="border:1px solid #C5A073">
            <div><b>墨典会员 V3</b><div class="sub">188****8888</div></div>
          </div>
          ${peopleStrip("biz", "同行会员")}
          ${[["user","个人信息"],["scroll","常用信息"],["heart","我的收藏"],["chat","我的评价"],["help","帮助与客服"],["gear","设置"]].map(m => menuRow(m[0], m[1], "")).join("")}
        `;
      }
      if (state.theme === "night" && !merchant) {
        return `
          <div class="profile nt-user" onclick="demo(event)">
            <img class="avatar-photo" src="${img("u-night")}" alt="">
            <div class="meta">
              <b>墨典会员<span class="badge">已开通</span></b>
              <div class="sub">温州 · 平阳</div>
            </div>
            <span class="chev">${ico("chev")}</span>
          </div>
          <div class="sec">我的订单 <span onclick="demo(event)">全部 &gt;</span></div>
          <div class="orders">
            ${[["待付款","pay"],["待使用","ticket"],["待评价","chat"],["退款/售后","refund"]].map(o => `<div onclick="demo(event)">${ico(o[1])}<b>${o[0]}</b></div>`).join("")}
          </div>
          ${[["heart","我的收藏",""],["coin","我的积分","2560"],["card","会员卡包",""],["pin","地址管理",""],["gear","设置",""],["headset","联系客服",""]].map(m => menuRow(m[0], m[1], m[2])).join("")}
          ${peopleStrip("night", "认识的茶客")}
        `;
      }
      if (state.theme === "family" && !merchant) {
        return `
          <div class="fam-user" onclick="demo(event)">
            <img src="${img("u-kid")}" alt="">
            <div><b>平阳小朋友</b><div class="sub">记录平阳亲子周末的点滴时光</div></div>
          </div>
          <div class="sec">我的足迹</div>
          <div class="orders">
            ${[["待付款","pay"],["待使用","ticket"],["待评价","chat"],["退款","refund"]].map(o => `<div onclick="demo(event)">${ico(o[1])}<b>${o[0]}</b></div>`).join("")}
          </div>
          ${[["star","我的收藏"],["pin","常用地址"],["headset","客服与帮助"],["gear","设置"]].map(m => menuRow(m[0], m[1], "")).join("")}
          ${peopleStrip("family", "玩伴")}
        `;
      }
      if (state.theme === "wechat" || state.theme === "biz" || state.theme === "night") {
        return `
          ${profile}
          <div class="sec">${merchant ? "店铺事务" : "我的订单"}</div>
          <div class="orders">${orders.map(o => `<div onclick="demo(event)">${ico(o[1])}<b>${o[0]}</b></div>`).join("")}</div>
          ${list.map(m => menuRow(m[0], m[1], m[2])).join("")}
        `;
      }

      if (state.theme === "jiangnan" && !merchant) {
        return `
          <div class="jn-mine-hero">
            <img class="bg" src="${img("book")}" alt="">
            <div class="jn-mine-user">
              <img class="avatar-photo" src="${img("u-mo")}" alt="">
              <div>
                <b>墨小典<span class="badge">墨典联盟会员</span></b>
                <div class="sub">138****8820</div>
              </div>
            </div>
          </div>
          <div style="padding:0 14px">
            <div class="sec">我的订单 <span onclick="demo(event)">全部订单 &gt;</span></div>
            <div class="orders">
              ${[["待付款","pay"],["待使用","ticket"],["待评价","chat"],["退款/售后","refund"]].map(o => `<div onclick="demo(event)">${ico(o[1])}<b>${o[0]}</b></div>`).join("")}
            </div>
            <div class="sec">我的服务</div>
            <div class="grid8">
              ${[["我的收藏","heart"],["我的足迹","foot"],["我的积分","coin"],["我的卡券","ticket"],["商家入驻","hotel"],["分享有礼","share"],["帮助与客服","help"],["设置","gear"]].map(g =>
                `<div class="cell" onclick="demo(event)"><div class="mark">${ico(g[1])}</div><span>${g[0]}</span></div>`
              ).join("")}
            </div>
            <div class="banner" onclick="demo(event)">
              <img src="${img("park")}" alt="">
              <div class="hero-cap"><span>山水秘境 · 休闲度假</span><b>南雁亲子谷</b></div>
            </div>
          </div>
        `;
      }

      return `
        ${profile}
        <div class="sec">${merchant ? "店铺事务" : "我的订单"}</div>
        <div class="orders">${orders.map(o => `<div onclick="demo(event)">${ico(o[1])}<b>${o[0]}</b></div>`).join("")}</div>
        <div class="sec">${merchant ? "商家服务" : "常用功能"}</div>
        <div class="grid8">${grid.map(g => `<div class="cell" onclick="demo(event)"><div class="mark">${ico(g[1])}</div><span>${g[0]}</span></div>`).join("")}</div>
        ${menuRow("spark", "AI 能力开关", "二期开启", "demoAi(event)")}
        ${menuRow("cam", "VR 全景预览", "已占位", "demoVr(event)")}
      `;
    }

    function navCopy() {
      const t = state.theme, r = state.role;
      const map = {
        0: { jiangnan: ["平阳 · 昆阳",""], wechat: ["墨典联盟","平阳 · 昆阳"], family: ["周末好呀","今天带娃去哪"], biz: ["墨典联盟",""], night: ["温州·平阳",""] },
        1: { jiangnan: ["附近",""], wechat: ["附近","平阳 · 昆阳"], family: ["附近好玩","走路就能到"], biz: ["墨典联盟",""], night: ["附近",""] },
        2: r === "merchant"
          ? { jiangnan: ["到店核销",""], wechat: ["核销","平阳 · 昆阳"], family: ["给小朋友核销","到店点一下"], biz: ["墨典联盟",""], night: ["核销",""] }
          : { jiangnan: ["会员中心",""], wechat: ["卡包","平阳 · 昆阳"], family: ["卡包","星星和门票"], biz: ["墨典联盟",""], night: ["会员中心",""] },
        3: r === "merchant"
          ? { jiangnan: ["商家中心","昆阳茶寮"], wechat: ["商家中心","昆阳茶寮"], family: ["我们店","昆阳茶寮"], biz: ["墨典联盟",""], night: ["店",""] }
          : { jiangnan: ["",""], wechat: ["我的","平阳 · 昆阳"], family: ["我家","平阳小朋友"], biz: ["墨典联盟",""], night: ["我的",""] },
      };
      return map[state.tab][t];
    }

    function tabIcon(i) {
      if (state.theme === "family") {
        const stamps = [
          { c: "#E85A28", k: "backpack" },
          { c: "#3D9A6A", k: "pin" },
          { c: "#E8A020", k: "card" },
          { c: "#4A8FD8", k: "house" },
        ];
        return `<span class="stamp" style="background:${stamps[i].c}">${ico(stamps[i].k)}</span>`;
      }
      const keys = ["home", "pin", "card", "user"];
      return ico(keys[i]);
    }

    function render() {
      $("phone").dataset.theme = state.theme;
      document.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c.dataset.id === state.theme));
      document.querySelectorAll(".role-chip").forEach(c => c.classList.toggle("on", c.dataset.role === state.role));
      document.querySelectorAll(".id-switch button").forEach(c => c.classList.toggle("on", c.dataset.role === state.role));
      $("blurb").textContent = styles.find(s => s.id === state.theme).blurb;
      const [title, loc] = navCopy();
      if (state.theme === "jiangnan" && state.tab === 0) {
        $("navTitle").innerHTML = `平阳 · 昆阳<span class="caret">${ico("down")}</span>`;
      } else if (state.theme === "family" && state.tab === 0) {
        $("navTitle").innerHTML = `周末好呀<span class="fam-heart">${ico("heart")}</span>`;
      } else if (state.theme === "biz") {
        $("navTitle").innerHTML = `<span class="biz-m">M</span>墨典联盟`;
      } else if (state.theme === "night" && state.tab === 0) {
        $("navTitle").innerHTML = `温州·平阳<span class="caret">${ico("down")}</span>`;
      } else if (state.theme === "night" && state.tab === 2 && state.role === "member") {
        $("navTitle").innerHTML = `<span class="caret">${ico("back")}</span>会员中心`;
      } else {
        $("navTitle").textContent = title;
      }
      if (state.theme === "wechat" && state.tab === 0) {
        $("navLoc").innerHTML = `${ico("pin")}平阳 · 昆阳`;
        $("navLoc").style.display = "";
      } else if (state.theme === "wechat") {
        $("navLoc").innerHTML = loc ? `${loc}<span class="caret">${ico("down")}</span>` : "";
        $("navLoc").style.display = loc ? "" : "none";
      } else if (state.theme === "family" && state.tab === 0) {
        $("navLoc").innerHTML = `今天带娃去哪 <span style="color:#E8A020">${ico("sun")}</span>`;
        $("navLoc").style.display = "";
      } else {
        $("navLoc").textContent = loc;
        $("navLoc").style.display = loc ? "" : "none";
      }
      let tools = "";
      if (state.theme === "jiangnan") {
        if (state.tab === 0) tools = `<button onclick="demo(event)">${ico("scan")}</button><button onclick="demo(event)">${ico("chat")}</button>`;
        if (state.tab === 2 && state.role === "member") tools = `<button onclick="demo(event)">${ico("ticket")}</button><button onclick="demo(event)">${ico("pay")}</button>`;
        if (state.tab === 3) tools = `<button onclick="demo(event)">${ico("gear")}</button><button onclick="demo(event)">${ico("chat")}</button>`;
      }
      if (state.theme === "biz") tools = `<button onclick="demo(event)">${ico("bell")}</button>`;
      if (state.theme === "night" && state.tab === 0) tools = `<div class="nt-search" onclick="demo(event)">${ico("search")}搜索</div>`;
      $("navTools").innerHTML = tools;
      $("screen").classList.toggle("edge", state.theme === "jiangnan" && state.tab === 3 && state.role === "member");
      $("tabbar").innerHTML = tabs[state.theme].map((l, i) =>
        `<button class="tab ${state.tab===i?"on":""}" data-tab="${i}">${tabIcon(i)}${l}</button>`
      ).join("");
      let html = "";
      if (state.tab === 0) html = state.role === "member" ? homeMember() : homeMerchant();
      if (state.tab === 1) html = nearby();
      if (state.tab === 2) html = state.role === "member" ? memberMember() : memberMerchant();
      if (state.tab === 3) html = mine();
      $("screen").innerHTML = html;
    }

    $("styleChips").innerHTML = styles.map(s =>
      `<button class="chip ${s.id==="jiangnan"?"on":""}" data-id="${s.id}">${s.name}</button>`
    ).join("");

    document.querySelector(".panel").addEventListener("click", (e) => {
      const chip = e.target.closest(".chip");
      if (chip) { state.theme = chip.dataset.id; state.filter = "全部"; render(); }
      const role = e.target.closest(".role-chip");
      if (role) { state.role = role.dataset.role; render(); }
    });
    $("phone").addEventListener("click", (e) => {
      const roleBtn = e.target.closest(".id-switch button");
      if (roleBtn) { state.role = roleBtn.dataset.role; render(); return; }
      const tab = e.target.closest(".tab");
      if (tab) { state.tab = Number(tab.dataset.tab); render(); }
    });

    const params = new URLSearchParams(location.search);
    if (styles.some(s => s.id === params.get("theme"))) state.theme = params.get("theme");
    if (["member","merchant"].includes(params.get("role"))) state.role = params.get("role");
    if (params.get("tab") != null) state.tab = Number(params.get("tab")) || 0;

    render();
  </script>
</body>
</html>
