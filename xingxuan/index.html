<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>墨典网络案例库演示 · 灵祺星选</title>
  <meta name="description" content="灵祺星选案例库演示：全部功能页可点，小程序与网页对照，五套风格可切换。" />
  <link rel="icon" href="/assets/brand/logo-mark.png" />
  <style>
    :root { --phone-w: 390px; --phone-h: 844px; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
      background: #161310;
      color: #F4EDE3;
    }
    .site-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 28px; border-bottom: 1px solid rgba(244,237,227,.08);
    }
    .site-bar a { color: inherit; text-decoration: none; display: flex; align-items: center; gap: 10px; }
    .site-bar img { width: 28px; height: 28px; object-fit: contain; }
    .site-bar b { font-size: 13px; font-weight: 650; }
    .site-bar span { font-size: 11px; color: #C9BBA8; }
    .stage {
      display: grid;
      grid-template-columns: 280px minmax(var(--phone-w), 1fr) minmax(240px, 300px);
      gap: 32px; max-width: 1320px; margin: 0 auto; padding: 28px 24px 56px;
      align-items: start;
    }
    .kicker { font-size: 11px; letter-spacing: .22em; color: #E0C089; }
    .panel h1 { font-size: 28px; letter-spacing: .08em; font-weight: 600; margin-top: 8px; }
    .panel p { margin-top: 10px; color: #C9BBA8; font-size: 14px; line-height: 1.7; }
    .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin-top: 18px; }
    .meta-grid div { font-size: 12px; color: #C9BBA8; }
    .meta-grid b { display: block; color: #F4EDE3; font-size: 13px; margin-top: 2px; }
    .label { margin: 26px 0 10px; font-size: 12px; letter-spacing: .16em; color: #E0C089; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      border: 1px solid rgba(244,237,227,.22); background: transparent; color: #EDE4D6;
      padding: 8px 14px; border-radius: 999px; cursor: pointer; font-size: 13px;
    }
    .chip.on { background: #C45C3A; border-color: #C45C3A; color: #fff; }
    .chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
    .hint { margin-top: 22px; font-size: 12px; color: #B0A494; line-height: 1.65; }
    .blurb {
      margin-top: 18px; padding: 12px 14px; border-radius: 12px;
      background: rgba(255,255,255,.05); color: #EDE4D6; font-size: 13px; line-height: 1.65;
    }
    .preview { display: flex; justify-content: center; }
    .feat-tip { font-size: 12px; color: #B0A494; margin: 0 0 10px; }
    .feat {
      display: grid; grid-template-columns: 32px 1fr; gap: 10px;
      width: 100%; text-align: left; padding: 14px 0;
      border: 0; border-bottom: 1px solid rgba(244,237,227,.1);
      background: transparent; color: inherit; font: inherit; cursor: pointer;
    }
    .feat:last-child { border-bottom: 0; }
    .feat-n { font-size: 12px; letter-spacing: .14em; color: #E0C089; font-weight: 700; padding-top: 3px; }
    .feat b { display: block; font-size: 15px; font-weight: 600; color: #F4EDE3; }
    .feat span { display: block; margin-top: 6px; font-size: 13px; line-height: 1.65; color: #C9BBA8; }
    .feat.on b, .feat:hover b { color: #E0C089; }

    .phone, .desk {
      --bg: #F5F7FA; --surface: #fff; --text: #1E3A5F; --muted: #64748B;
      --line: #E5E7EB; --accent: #2B6CB0; --on-accent: #fff; --chrome: #fff;
      --bar: #fff; --tab: #94A3B8; --tab-on: #2B6CB0; --price: #C2410C;
      --radius: 10px; --chrome-text: #1E3A5F; --chrome-muted: #64748B;
    }
    .phone[data-theme="songbai"], .desk[data-theme="songbai"] {
      --bg: #F4F7F5; --text: #1C3D32; --muted: #5C7368; --accent: #1F7A5C;
      --tab-on: #1F7A5C; --chrome-text: #1C3D32;
    }
    .phone[data-theme="nuansha"], .desk[data-theme="nuansha"] {
      --bg: #F7F5F1; --text: #44403C; --muted: #78716C; --accent: #B45309;
      --tab-on: #B45309; --chrome-text: #44403C; --radius: 12px;
    }
    .phone[data-theme="qingci"], .desk[data-theme="qingci"] {
      --bg: #F2F7F6; --text: #134E4A; --muted: #5B7C78; --accent: #0F766E;
      --tab-on: #0F766E; --chrome-text: #134E4A;
    }
    .phone[data-theme="wuqing"], .desk[data-theme="wuqing"] {
      --bg: #F4F5F6; --text: #334155; --muted: #64748B; --accent: #5B7C8A;
      --tab-on: #5B7C8A; --chrome-text: #334155; --radius: 8px;
    }

    .phone {
      width: var(--phone-w); height: var(--phone-h); border-radius: 40px; overflow: hidden;
      display: flex; flex-direction: column; background: var(--bg); color: var(--text);
      box-shadow: 0 40px 80px rgba(0,0,0,.45); border: 10px solid #2A2622; font-size: 15px;
      position: relative;
    }
    .desk { position: relative; }
    .chrome { background: var(--chrome); color: var(--chrome-text); padding: 10px 10px 10px 16px; flex-shrink: 0; border-bottom: 1px solid var(--line); }
    .status { height: 30px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 650; color: var(--chrome-muted); }
    .status-right { display: flex; align-items: center; gap: 8px; }
    .capsule { width: 86px; height: 30px; border-radius: 15px; background: #111; opacity: .88; }
    .id-switch { display: flex; padding: 2px; border-radius: 10px; background: var(--bg); }
    .id-switch button {
      border: 0; background: transparent; min-width: 46px; height: 26px;
      font-size: 12px; font-weight: 650; cursor: pointer; border-radius: 8px; color: var(--muted);
    }
    .id-switch .on { background: var(--accent); color: var(--on-accent); }
    .nav { padding: 6px 6px 2px 0; }
    .nav-title { font-size: 18px; font-weight: 700; color: var(--chrome-text); }
    .nav-loc { font-size: 12px; margin-top: 2px; color: var(--chrome-muted); }
    .screen { flex: 1; min-height: 0; overflow: auto; padding: 12px 14px 22px; background: var(--bg); }
    .screen::-webkit-scrollbar { width: 0; }
    .tabbar {
      flex-shrink: 0; height: 72px; display: flex; padding: 6px 4px 14px;
      background: var(--bar); border-top: 1px solid var(--line); color: var(--tab);
    }
    .tab {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px; font-size: 11px; font-weight: 600; cursor: pointer; background: none; border: 0; color: inherit;
    }
    .tab.on { color: var(--tab-on); }

    .search, .field, .card, .list-row, .stat, .menu, .msg, .event {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    }
    .search { height: 40px; display: flex; align-items: center; padding: 0 12px; font-size: 13px; color: var(--muted); margin-bottom: 10px; cursor: pointer; width: 100%; text-align: left; font: inherit; }
    .filters { display: flex; gap: 6px; overflow: auto; margin-bottom: 10px; }
    .filters::-webkit-scrollbar { height: 0; }
    .filters button {
      height: 30px; padding: 0 12px; font-size: 12px; font-weight: 650; white-space: nowrap;
      display: inline-flex; align-items: center; border-radius: 8px; background: var(--surface);
      border: 1px solid var(--line); color: var(--muted); cursor: pointer; font: inherit;
    }
    .filters button.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
    .card { padding: 12px; margin-bottom: 10px; cursor: pointer; }
    .card h3 { font-size: 15px; font-weight: 700; }
    .sub { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.5; }
    .row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; gap: 8px; }
    .price { color: var(--price); font-weight: 700; font-size: 16px; }
    .btn {
      border: 0; cursor: pointer; height: 32px; padding: 0 12px; font-size: 12px; font-weight: 700;
      border-radius: 8px; background: var(--accent); color: var(--on-accent);
    }
    .btn.ghost { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
    .hero {
      height: 120px; border-radius: var(--radius); margin-bottom: 12px; padding: 16px;
      background: var(--accent); color: var(--on-accent);
    }
    .hero b { display: block; font-size: 18px; }
    .hero span { font-size: 12px; opacity: .9; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
    .stat { padding: 10px 4px; text-align: center; cursor: pointer; }
    .stat b { display: block; font-size: 16px; }
    .stat span { font-size: 11px; color: var(--muted); }
    .menu { overflow: hidden; }
    .menu button, .list-row {
      width: 100%; text-align: left; background: var(--surface); border: 0; border-bottom: 1px solid var(--line);
      padding: 13px 12px; font: inherit; color: var(--text); cursor: pointer;
      display: flex; justify-content: space-between; align-items: center;
    }
    .menu button:last-child { border-bottom: 0; }
    .menu i, .chev { color: var(--muted); font-style: normal; }
    .field { padding: 10px 12px; margin-bottom: 8px; font-size: 13px; color: var(--muted); }
    .field b { display: block; color: var(--text); font-weight: 600; margin-top: 2px; }
    .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 10px; }
    .week button { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 2px; text-align: center; font-size: 11px; color: var(--muted); cursor: pointer; font: inherit; }
    .week button.on { border-color: var(--accent); color: var(--accent); }
    .week b { display: block; font-size: 14px; color: var(--text); }
    .event { padding: 12px; margin-bottom: 8px; cursor: pointer; }
    .msg { padding: 12px; margin-bottom: 8px; cursor: pointer; width: 100%; text-align: left; font: inherit; color: inherit; display: block; }
    .chat-in { display: flex; gap: 8px; margin-top: 12px; }
    .chat-in input {
      flex: 1; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
      font: inherit; background: var(--surface); color: var(--text);
    }
    .toast {
      position: absolute; left: 50%; bottom: 88px; transform: translateX(-50%);
      background: rgba(20,16,12,.92); color: #fff; padding: 9px 16px; border-radius: 8px;
      font-size: 12px; opacity: 0; pointer-events: none; transition: .2s; white-space: nowrap; z-index: 6;
    }
    .desk .toast { bottom: 24px; }
    .toast.show { opacity: 1; }
    .sheet { position: absolute; inset: 0; z-index: 8; display: none; }
    .sheet.on { display: block; }
    .sheet-mask { position: absolute; inset: 0; background: rgba(12,10,8,.4); }
    .sheet-card {
      position: absolute; left: 0; right: 0; bottom: 0; max-height: 72%;
      background: var(--surface); color: var(--text); border-radius: 16px 16px 0 0;
      padding: 16px; overflow: auto;
    }
    .sheet-hd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .sheet-hd button { border: 0; background: 0; color: var(--accent); cursor: pointer; font: inherit; }
    .bubble { max-width: 80%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 11px; font-size: 13px; margin: 8px 0; }
    .bubble.me { margin-left: auto; background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .funnel { display: flex; gap: 6px; margin-bottom: 12px; }
    .funnel button { flex: 1; text-align: center; font-size: 11px; padding: 8px 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; color: var(--muted); cursor: pointer; font: inherit; }
    .funnel button b { display: block; font-size: 14px; color: var(--text); }
    button.stat, button.card, button.field { font: inherit; color: inherit; width: 100%; text-align: left; }

    .desk {
      width: min(980px, 100%); min-height: 640px; background: var(--surface);
      border: 1px solid #2A2622; border-radius: 12px; overflow: hidden;
      display: grid; grid-template-columns: 188px 1fr; box-shadow: 0 40px 80px rgba(0,0,0,.45);
      position: relative;
    }
    .side { background: var(--chrome); border-right: 1px solid var(--line); padding: 18px 10px; }
    .side .logo { font-size: 15px; font-weight: 700; color: var(--text); padding: 0 8px; }
    .side .ed { font-size: 11px; color: var(--muted); padding: 4px 8px 14px; }
    .side button {
      display: block; width: 100%; text-align: left; background: 0; border: 0; color: var(--muted);
      padding: 9px 10px; font: inherit; cursor: pointer; border-radius: 8px; font-size: 13px;
    }
    .side button.on { background: var(--bg); color: var(--accent); font-weight: 650; }
    .main { background: var(--bg); padding: 20px; color: var(--text); overflow: auto; max-height: 640px; }
    .main h2 { font-size: 18px; margin-bottom: 4px; }
    table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); font-size: 13px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 500; font-size: 12px; }
    .board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .col { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; min-height: 180px; }
    .col h4 { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    .col p { background: var(--bg); border-radius: 8px; padding: 8px; font-size: 12px; margin-bottom: 6px; }
    .split { display: grid; grid-template-columns: 200px 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); min-height: 320px; overflow: hidden; }
    .split-list button { width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: var(--surface); padding: 12px; font: inherit; cursor: pointer; color: var(--text); }
    .split-list button.on { background: var(--bg); color: var(--accent); }
    .split-thread { padding: 14px; background: var(--bg); }

    @media (max-width: 1100px) {
      .stage { grid-template-columns: 280px 1fr; }
      .features { grid-column: 1 / -1; max-width: 640px; }
    }
    @media (max-width: 860px) {
      .stage { grid-template-columns: 1fr; }
      .desk { grid-template-columns: 1fr; }
      .side { display: none; }
    }
  </style>
</head>
<body>
  <script src="/js/gate.js" data-case="xingxuan"></script>
  <header class="site-bar">
    <a href="/"><img src="/assets/brand/logo-mark.png" alt="" /><b>墨典网络 · 案例库</b></a>
    <span>CASE · 灵祺星选</span>
  </header>
  <div class="stage">
    <aside class="panel">
      <div class="kicker">CASE</div>
      <h1>灵祺星选</h1>
      <p>达人履约平台。和垟里GO一样：左侧换风格与身份，右侧点功能页，中间跟着走。小程序与网页是同一套页面，只换端。</p>
      <div class="meta-grid">
        <div>产品<b>灵祺星选</b></div>
        <div>场景<b>温州 · 达人履约</b></div>
        <div>类型<b>小程序 + 网页</b></div>

      <p class="feat-tip" id="featTip">点一条，中间跟着走</p>
      <div id="featList"></div>
    </aside>
  </div>
  <script>
    const STYLES = [
      { id: "jilan", name: "霁蓝", acc: "#2B6CB0", blurb: "飞书/钉钉类工具蓝。大厅、发单、日历、消息都是同一套浅底。" },

      { id: "shoot", t: "女装店跟拍一天", c: "杭州 · 西湖", p: "¥1,500", tag: "拍剪", hall: "paichian", plat: "小红书", city: "杭州" },
      { id: "ice", t: "云剪混剪 · 品牌口播", c: "杭州 · 不限", p: "¥600", tag: "云剪", hall: "ice", plat: "抖音", city: "杭州" }
    ];
    const HALLS = [["normal", "普通单"], ["urgent", "急单"], ["paichian", "拍剪"], ["ice", "云剪"]];
    const PLATS = ["全部平台", "抖音", "小红书"];
    const CITIES = ["全部", "温州", "杭州"];
    const DAYS = [14, 15, 16, 17, 18, 19, 20];
    const FEATS = {
      talent: [
        { page: "home", title: "首页", desc: "普通单 / 急单 / 拍剪分栏，定位城市后刷商单。" },

      ],

        { page: "recommend", title: "推荐大厅", desc: "对照达人端看到的同一批商单。" },

      return JOBS.filter((j) => {
        if (j.hall !== state.hall) return false;
        if (state.plat !== "全部平台" && j.plat !== state.plat) return false;
        if (state.city !== "全部" && j.city !== state.city) return false;
        if (state.kw && !(j.t + j.c + j.tag).includes(state.kw)) return false;
        return true;
      });

    function toast(msg) {
      const host = document.querySelector(".phone") || document.querySelector(".desk");
      if (!host) return;
      let el = host.querySelector(".toast");
      if (!el) { el = document.createElement("div"); el.className = "toast"; host.appendChild(el); }
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove("show"), 1800);
    }
    function openSheet(title, html) {
      const host = document.querySelector(".phone") || document.querySelector(".desk");
      if (!host) return;
      let sheet = host.querySelector(".sheet");
      if (!sheet) {
        sheet = document.createElement("div");
        sheet.className = "sheet";
        sheet.innerHTML = `<div class="sheet-mask" data-act="close-sheet"></div>
          <div class="sheet-card"><div class="sheet-hd"><b id="sheetTitle"></b><button type="button" data-act="close-sheet">关闭</button></div><div id="sheetBody"></div></div>`;
        host.appendChild(sheet);
      }
      sheet.querySelector("#sheetTitle").textContent = title;
      sheet.querySelector("#sheetBody").innerHTML = html;
      sheet.classList.add("on");
    }
    function closeSheet() {
      document.querySelectorAll(".sheet").forEach((s) => s.classList.remove("on"));

          <div class="logo">灵祺星选</div>
          <div class="ed">${isPr() ? "PR" : "达人"} · ${style().name}</div>
          ${nav.map(([label, page]) => `<button class="${on(page) ? "on" : ""}" data-page="${page}" type="button">${label}</button>`).join("")}
        </aside>
        <div class="main">${webBody()}</div>
        <div class="toast"></div>
      </div>`;
    }

    function ensurePage() {
      if (!feats().some((f) => f.page === state.page)) state.page = "home";
    }

    function render() {
      ensurePage();
      $("blurb").textContent = style().blurb;
      $("styleChips").innerHTML = STYLES.map((s) =>
        `<button class="chip ${s.id === state.theme ? "on" : ""}" data-theme="${s.id}" type="button"><span class="dot" style="background:${s.acc}"></span>${s.name}</button>`
      ).join("");
      $("deviceChips").innerHTML =
        `<button class="chip ${state.device === "mp" ? "on" : ""}" data-device="mp" type="button">小程序</button>` +
        `<button class="chip ${state.device === "web" ? "on" : ""}" data-device="web" type="button">网页</button>`;
      $("roleChips").innerHTML =
        `<button class="chip ${state.role === "talent" ? "on" : ""}" data-role="talent" type="button">达人</button>` +
        `<button class="chip ${state.role === "pr" ? "on" : ""}" data-role="pr" type="button">PR</button>`;
      $("featKicker").textContent = isPr() ? "全部页面 · PR" : "全部页面 · 达人";
      $("featTip").textContent = (state.device === "web" ? "网页" : "小程序") + " · 点一条，中间跟着走";
      $("featList").innerHTML = feats().map((f, i) =>
        `<button type="button" class="feat ${state.page === f.page ? "on" : ""}" data-page="${f.page}">
          <div class="feat-n">${String(i + 1).padStart(2, "0")}</div>
          <div><b>${f.title}</b><span>${f.desc}</span></div>
        </button>`
      ).join("");
      $("preview").innerHTML = state.device === "web" ? webFrame() : mpFrame();
    }

    document.querySelector(".stage").addEventListener("click", (e) => {
      if (e.target.closest("[data-act='close-sheet']")) { closeSheet(); return; }
      const theme = e.target.closest("[data-theme]");
      if (theme && theme.dataset.theme && STYLES.some((s) => s.id === theme.dataset.theme)) {
        state.theme = theme.dataset.theme;
        render();
        return;
      }
      const device = e.target.closest("[data-device]");
      if (device) { state.device = device.dataset.device; render(); return; }
      const role = e.target.closest("[data-role]");
      if (role) { state.role = role.dataset.role; render(); return; }

      const actEl = e.target.closest("[data-act]");
      const act = actEl && actEl.dataset.act;
      if (act === "hall") { state.hall = actEl.dataset.v; render(); return; }
      if (act === "plat") { state.plat = actEl.dataset.v; render(); return; }
      if (act === "city") { state.city = actEl.dataset.v; render(); return; }
      if (act === "search") {
        openSheet("搜索商单", `<form data-act="do-search"><input name="q" value="${state.kw}" placeholder="城市 / 探店 / 云剪" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit" /><div style="margin-top:12px"><button class="btn" type="submit">搜索</button></div></form>`);
        return;
      }
      if (act === "open-job") {
        state.jobId = actEl.dataset.job;
        state.page = "detail";
        render();
        return;
      }
      if (act === "fav") {
        const id = actEl.dataset.job;
        state.fav[id] = !state.fav[id];
        toast(state.fav[id] ? "已收藏，可在「我的收藏」查看" : "已取消收藏");
        render();
        return;
      }
      if (act === "apply") {
        state.applied[actEl.dataset.job] = true;
        toast("报名已提交，可在「我的报名」查看");
        state.page = "applications";
        render();
        return;
      }
      if (act === "publish") {
        if (!isPr()) { state.role = "pr"; toast("已切到 PR，发布到大厅"); }
        else toast("已发布，达人端大厅可刷到");
        state.page = "home";
        state.hall = "normal";
        render();
        return;
      }
      if (act === "chat") {
        state.chat = actEl.dataset.v || "pr";
        state.page = "chat";
        render();
        return;
      }
      if (act === "pick") {
        state.picked[actEl.dataset.v] = true;
        state.picked.hotpot = true;
        toast("已入选阿宁，日历标了探店日");
        state.page = "calendar";
        state.weekDay = 15;
        render();
        return;
      }
      if (act === "hold") { toast("已标记待定"); return; }
      if (act === "day") { state.weekDay = Number(actEl.dataset.v); render(); return; }
      if (act === "deliver") { toast("演示：成片已上传，待 PR 验收"); return; }
      if (act === "quote") {
        openSheet("修改报价", `<p class="sub">演示占位，正式环境写入你的报价表。</p><button class="btn" data-act="close-sheet" type="button" style="margin-top:12px">知道了</button>`);
        return;
      }
      if (act === "recharge") { toast("演示充值 200 积分成功"); return; }
      if (act === "faq") {
        openSheet("小灵同学", `<p>报名后一般 24 小时内 PR 会看。入选后系统会发消息，并出现在商单日历。</p><button class="btn" data-page="messages" type="button" style="margin-top:12px">去消息</button>`);
        return;
      }
      if (act === "manual") {
        openSheet("使用手册", `<p>1. 大厅筛选并报名<br>2. 入选后看日历探店日<br>3. 交片日上传成片<br>4. PR 在报名者里验收</p>`);
        return;
      }
      if (act === "watch-add") { toast("已从灰名单移出（演示）"); return; }
      if (act === "relay") { toast("已同步 12 条到发单报名者"); state.page = "applicants"; render(); return; }
      if (act === "tip") { toast(actEl.dataset.msg || "演示占位"); return; }

      const page = e.target.closest("[data-page]");
      if (page) {
        const next = page.dataset.page;
        if (next === "publish" && !isPr()) {
          state.role = "pr";
          toast("发招募是 PR 功能，已切到 PR");
        }
        if (next === "apply" && isPr()) {
          toast("报名是达人功能，已切到达人");
          state.role = "talent";
        }
        state.page = next;
        render();
      }
    });
    document.querySelector(".stage").addEventListener("submit", (e) => {
      const form = e.target.closest("form");
      if (!form) return;
      e.preventDefault();
      if (form.dataset.act === "do-search") {
        state.kw = (form.q && form.q.value || "").trim();
        closeSheet();
        state.page = state.page === "home" ? "home" : "recommend";
        toast(state.kw ? "已按「" + state.kw + "」筛选" : "已清空搜索");
        render();
        return;
      }
      if (form.dataset.act === "send-chat") {
        toast("演示已发出，正式环境会送到对方消息里");
        form.reset();
      }
    });
    render();
  </script>
</body>
</html>
