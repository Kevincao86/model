<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>墨典网络 · 案例库</title>
  <meta name="description" content="宁波墨典网络科技有限公司案例库。垟里GO、灵祺商家ERP、光明牛奶小程序、魔楽斑马小程序演示。" />
  <link rel="icon" href="/assets/brand/logo-mark.png" />
  <style>
    :root {
      --ink: #100E0C;
      --ink-2: #1A1714;
      --paper: #EDE4D6;
      --mute: #B8AA96;
      --line: rgba(237, 228, 214, .12);
      --gold: #C4A46A;
      --gold-2: #E0C089;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--ink); color: var(--paper); }
    body {
      min-height: 100dvh;
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
    }
    a { color: inherit; text-decoration: none; }
    .wrap { width: min(1180px, calc(100% - 40px)); margin: 0 auto; }

    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 0 16px;
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand img { width: 40px; height: 40px; object-fit: contain; }
    .brand b { display: block; font-size: 15px; letter-spacing: .18em; font-weight: 620; }
    .brand small { display: block; margin-top: 2px; color: var(--mute); font-size: 11px; letter-spacing: .16em; }
    .nav { display: flex; gap: 22px; color: var(--mute); font-size: 12px; letter-spacing: .16em; }
    .nav a:hover { color: var(--gold-2); }

    .hero {
      display: grid;
      grid-template-columns: 1.4fr .8fr;
      gap: 48px;
      padding: 56px 0 40px;
      align-items: end;
    }
    .kicker { color: var(--gold); letter-spacing: .28em; font-size: 11px; }
    h1 {
      margin-top: 14px;
      font-size: clamp(42px, 7vw, 76px);
      font-weight: 530;
      letter-spacing: .08em;
      line-height: 1.05;
    }
    .hero p { margin-top: 16px; max-width: 46ch; color: var(--mute); font-size: 15px; line-height: 1.8; }
    .hero-meta {
      border-left: 1px solid var(--gold);
      padding: 8px 0 8px 22px;
      color: var(--mute);
      font-size: 13px;
      line-height: 1.9;
    }
    .hero-meta b { display: block; color: var(--paper); font-weight: 560; letter-spacing: .12em; }

    .toolbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px;
      padding: 0 0 18px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 22px;
    }
    .toolbar span { color: var(--mute); font-size: 12px; letter-spacing: .16em; }
    .switch {
      display: inline-flex;
      border: 1px solid var(--line);
    }
    .switch button {
      background: transparent;
      color: var(--mute);
      border: 0;
      padding: 8px 16px;
      font: inherit;
      font-size: 12px;
      letter-spacing: .16em;
      cursor: pointer;
    }
    .switch button.on {
      background: var(--gold);
      color: #1A140C;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      padding-bottom: 80px;
    }
    .catalog.list .grid {
      grid-template-columns: 1fr;
      gap: 12px;
    }
    .card {
      position: relative;
      overflow: hidden;
      min-height: 340px;
      background: var(--ink-2);
      border: 1px solid var(--line);
      cursor: pointer;
      text-align: left;
      color: inherit;
      width: 100%;
      font: inherit;
    }
    .card.featured { min-height: 440px; grid-column: 1 / -1; }
    .card img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scale(1.04);
      transition: transform .7s ease, filter .7s ease;
      filter: saturate(.95) contrast(1.06) brightness(1.05);
    }
    .card:hover img { transform: scale(1.08); filter: saturate(1.05) contrast(1.08) brightness(1.08); }
    .card::after {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(16,14,12,.12) 35%, rgba(16,14,12,.88) 100%);
    }
    .card-body {
      position: relative; z-index: 1;
      height: 100%;
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: 24px;
    }
    .tag { color: var(--gold-2); font-size: 11px; letter-spacing: .2em; }
    .card h2 { margin-top: 8px; font-size: 28px; font-weight: 560; letter-spacing: .1em; }
    .card.featured h2 { font-size: 40px; }
    .card p { margin-top: 10px; color: #D8CCBA; font-size: 13px; line-height: 1.7; max-width: 42ch; }
    .go {
      margin-top: 16px;
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--gold-2);
      font-size: 12px; letter-spacing: .18em;
    }
    .go i {
      width: 28px; height: 1px; background: var(--gold);
      display: inline-block;
    }

    .catalog.list .card {
      min-height: 0;
      display: grid;
      grid-template-columns: 168px 1fr;
      align-items: stretch;
    }
    .catalog.list .card.featured { min-height: 0; grid-column: auto; }
    .catalog.list .card img {
      position: relative;
      inset: auto;
      width: 100%;
      height: 100%;
      min-height: 112px;
      transform: none;
    }
    .catalog.list .card:hover img { transform: none; }
    .catalog.list .card::after { display: none; }
    .catalog.list .card-body {
      height: auto;
      justify-content: center;
      padding: 18px 20px;
      background: var(--ink-2);
    }
    .catalog.list .card h2 { font-size: 22px; }
    .catalog.list .card p { max-width: 68ch; }

    footer {
      border-top: 1px solid var(--line);
      padding: 22px 0 36px;
      display: flex; justify-content: space-between; gap: 16px;
      color: var(--mute); font-size: 12px; letter-spacing: .08em;
    }

    .modal {
      position: fixed; inset: 0; z-index: 20;
      background: rgba(10,8,6,.72);
      display: none; place-items: center;
      padding: 24px;
    }
    .modal.on { display: grid; }
    .sheet {
      width: min(420px, 100%);
      background: #161310;
      border: 1px solid rgba(196,164,106,.35);
      padding: 28px 26px 24px;
    }
    .sheet .tag { margin-bottom: 8px; }
    .sheet h3 { font-size: 24px; letter-spacing: .12em; font-weight: 560; }
    .sheet p { margin: 10px 0 18px; color: var(--mute); font-size: 13px; line-height: 1.7; }
    .sheet input {
      width: 100%;
      background: transparent;
      border: 0;
      border-bottom: 1px solid rgba(237,228,214,.28);
      color: var(--paper);
      font: inherit;
      font-size: 16px;
      padding: 10px 0;
      outline: none;
    }
    .sheet input:focus { border-bottom-color: var(--gold); }
    .actions { display: flex; gap: 10px; margin-top: 22px; }
    .btn {
      flex: 1;
      border: 1px solid rgba(237,228,214,.2);
      background: transparent;
      color: var(--paper);
      padding: 11px 14px;
      letter-spacing: .16em;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    .btn.gold { background: var(--gold); border-color: var(--gold); color: #1A140C; }
    .err { min-height: 20px; margin-top: 10px; color: #D27A5A; font-size: 12px; }

    @media (max-width: 860px) {
      .hero, .grid { grid-template-columns: 1fr; }
      .card.featured { grid-column: auto; min-height: 360px; }
      .catalog.list .card { grid-template-columns: 108px 1fr; }
      .catalog.list .card h2 { font-size: 18px; }
      header { align-items: flex-start; }
      .nav { display: none; }
      footer { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="brand" href="/">
        <img src="/assets/brand/logo-mark.png" alt="墨典网络" />
        <span>
          <b>墨典网络</b>
          <small>CASE LIBRARY</small>
        </span>
      </a>
      <nav class="nav">
        <span>宁波</span>
        <a href="https://m.mofangdianai.com">官网</a>
        <span>演示需密码</span>
        <a href="https://admin.modianmodel.online">ADMIN</a>
      </nav>
    </header>

    <section class="hero">
      <div>
        <div class="kicker">MODIAN MODEL / 2026</div>
        <h1>案例库</h1>
        <p>可点开的产品演示。点进卡片后输入对应密码即可进入，密码由案例库后台单独设置。</p>
      </div>
      <div class="hero-meta">
        <b>宁波墨典网络科技有限公司</b>
        本地生活 · 商家中台 · 品牌小程序<br />
        面向客户演示，不公开传播源码与后台。
      </div>
    </section>

    <div class="catalog" id="catalog" data-view="cards">
      <div class="toolbar">
        <span>预览模式</span>
        <div class="switch" role="tablist" aria-label="预览模式">
          <button type="button" id="viewCards" class="on" data-view="cards">图显</button>
          <button type="button" id="viewList" data-view="list">列表</button>
        </div>
      </div>
      <section class="grid" id="grid"></section>
    </div>

    <footer>
      <span>© 宁波墨典网络科技有限公司</span>
      <span>www.modianmodel.online</span>
    </footer>
  </div>

  <div class="modal" id="modal">
    <div class="sheet">
      <div class="tag" id="mTag">PASSWORD</div>
      <h3 id="mTitle">输入密码</h3>
      <p id="mBlurb">该演示受密码保护。</p>
      <input id="mPass" type="password" placeholder="请输入案例密码" autocomplete="current-password" />
      <div class="err" id="mErr"></div>
      <div class="actions">
        <button class="btn" id="mCancel" type="button">取消</button>
        <button class="btn gold" id="mGo" type="button">进入演示</button>
      </div>
    </div>
  </div>

  <script>
    const grid = document.getElementById('grid');
    const catalog = document.getElementById('catalog');
    const modal = document.getElementById('modal');
    let current = null;

    function setView(view) {
      const mode = view === 'list' ? 'list' : 'cards';
      catalog.dataset.view = mode;
      catalog.classList.toggle('list', mode === 'list');
      document.getElementById('viewCards').classList.toggle('on', mode === 'cards');
      document.getElementById('viewList').classList.toggle('on', mode === 'list');
      try { localStorage.setItem('md-library-view', mode); } catch (_) {}
    }

    function cardHTML(item, i) {
      const featured = i === 0 ? ' featured' : '';
      return `<button class="card${featured}" data-id="${item.id}" type="button">
        <img src="${item.cover}" alt="${item.title}" />
        <div class="card-body">
          <div class="tag">${item.tag || 'CASE'}</div>
          <h2>${item.title}</h2>
          <p>${item.blurb || ''}</p>
          <div class="go"><i></i>输入密码查看</div>
        </div>
      </button>`;
    }

    function openModal(item) {
      current = item;
      document.getElementById('mTag').textContent = item.tag || 'PASSWORD';
      document.getElementById('mTitle').textContent = item.title;
      document.getElementById('mBlurb').textContent = item.blurb || '该演示受密码保护。';
      document.getElementById('mErr').textContent = '';
      document.getElementById('mPass').value = '';
      modal.classList.add('on');
      document.getElementById('mPass').focus();
    }

    function closeModal() {
      modal.classList.remove('on');
      current = null;
    }

    async function unlock() {
      if (!current) return;
      const password = document.getElementById('mPass').value.trim();
      if (!password) {
        document.getElementById('mErr').textContent = '请输入密码';
        return;
      }
      document.getElementById('mGo').disabled = true;
      try {
        const r = await fetch('/api/unlock', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ id: current.id, password })
        });
        const j = await r.json();
        if (r.ok) {
          try { sessionStorage.setItem('md-unlock-' + current.id, '1'); } catch (_) {}
          location.href = j.demoUrl;
          return;
        }
        if ((r.status === 404 || r.status === 403) && current.passwordHash) {
          const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('modian-case-v1:' + password));
          const hex = [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
          if (hex === current.passwordHash) {
            try { sessionStorage.setItem('md-unlock-' + current.id, '1'); } catch (_) {}
            location.href = current.demoUrl;
            return;
          }
        }
        document.getElementById('mErr').textContent = j.error || '密码不正确';
      } catch {
        document.getElementById('mErr').textContent = '网络异常，请重试';
      } finally {
        document.getElementById('mGo').disabled = false;
      }
    }

    const FALLBACK = [
      { id: 'yangli', title: '垟里GO', tag: '本地生活 · 小程序', blurb: '墨典联盟 · 温州平阳本地生活。五套风格可切换：江南生活、微信本地、亲子周末、商务预订、鳌江夜色。', cover: '/assets/covers/cover-yangli.jpg', demoUrl: '/yangli/' },
      { id: 'lingqi', title: '灵祺商家ERP', tag: '商家中台 · 演示', blurb: '面向餐饮与零售门店的经营中台演示：订单、营收、库存预警与待发货一目了然。', cover: '/assets/covers/cover-lingqi.jpg', demoUrl: '/demo/lingqi.html' },
      { id: 'guangming', title: '光明牛奶小程序', tag: '品牌零售 · 小程序', blurb: '乳品品牌会员小程序演示：鲜奶订阅、门店自提、积分兑换。', cover: '/assets/covers/cover-guangming.jpg', demoUrl: '/demo/guangming.html' },
      { id: 'zebra', title: '魔楽斑马小程序', tag: '亲子娱乐 · 小程序', blurb: '亲子场馆预约小程序演示：课程卡、周末场次、亲子套票。', cover: '/assets/covers/cover-zebra.jpg', demoUrl: '/demo/zebra.html' },
      { id: 'xingxuan', title: '灵祺星选', tag: '达人履约 · 小程序 / Web', blurb: '全部功能页可点；含票根工牌、导视看板等八套布局，大厅写死实拍图。', cover: '/xingxuan/img/xx-hero-biz.jpg', demoUrl: '/xingxuan/', passwordHash: '3db32b11936a82c4ff03365d1864dba8ff511bacfe6965a36e2e0629e025f81f' }
    ];

    async function boot() {
      let cases = FALLBACK;
      try {
        const r = await fetch('/api/cases', { credentials: 'include' });
        const j = await r.json();
        if (j.cases && j.cases.length) {
          const have = new Set(j.cases.map((c) => c.id));
          cases = j.cases.concat(FALLBACK.filter((f) => !have.has(f.id)));
        }
      } catch (_) {}
      cases = cases.filter((c) => c.visible !== false);
      grid.innerHTML = cases.map(cardHTML).join('');
      grid.querySelectorAll('.card').forEach((el) => {
        el.addEventListener('click', () => {
          const item = cases.find((c) => c.id === el.dataset.id);
          if (!item) return;
          openModal(item);
        });
      });
      const need = new URLSearchParams(location.search).get('need');
      if (need) {
        const item = cases.find((c) => c.id === need);
        if (item) openModal(item);
      }
    }

    document.getElementById('mCancel').onclick = closeModal;
    document.getElementById('mGo').onclick = unlock;
    document.getElementById('mPass').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') unlock();
    });
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
    document.getElementById('viewCards').onclick = () => setView('cards');
    document.getElementById('viewList').onclick = () => setView('list');
    try { setView(localStorage.getItem('md-library-view') || 'cards'); } catch (_) { setView('cards'); }
    boot().catch(() => {
      grid.innerHTML = '<p style="color:#B8AA96">案例列表加载失败，请稍后刷新。</p>';
    });
  </script>
</body>
</html>
